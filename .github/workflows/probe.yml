name: probe
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: check and alert
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
          FLEET_URL: ${{ secrets.FLEET_URL }}
          FIX_URL: ${{ secrets.FIX_URL }}
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
          CONTACT_ID: ${{ secrets.CONTACT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          # --- probe Sibo HQ health (3 tries, as v1) ---
          hq_ok=0; body=""
          for i in 1 2 3; do
            body=$(curl -s --max-time 15 "$HEALTH_URL" || true)
            if echo "$body" | grep -q '"ok":true'; then hq_ok=1; break; fi
            sleep 20
          done
          pending=$(echo "${body:-}" | grep -o '"pendingScheduled":[0-9]*' | grep -o '[0-9]*' || echo "")

          # --- probe fleet health (v2): counts-only public endpoint ---
          fleet_ok=0; fleet_body=""
          if [ -n "${FLEET_URL:-}" ]; then
            for i in 1 2; do
              fleet_body=$(curl -s --max-time 15 "$FLEET_URL" || true)
              if echo "$fleet_body" | grep -q '"ok":true'; then fleet_ok=1; break; fi
              sleep 10
            done
          else
            fleet_ok=1  # secret not set yet -> don't fail on the new check
          fi

          ok=0; [ "$hq_ok" = "1" ] && [ "$fleet_ok" = "1" ] && ok=1
          # dark = neither endpoint returned ANY body -> Mac/funnel/internet down,
          # not a single-app failure. Both empty bodies is the tell.
          dark=0; [ -z "${body:-}" ] && [ -z "${fleet_body:-}" ] && dark=1

          state=$(gh api "repos/$REPO/contents/state.json?ref=state" -q .content 2>/dev/null | base64 -d 2>/dev/null || echo '{}')
          fails=$(echo "$state" | grep -o '"fails":[0-9]*' | grep -o '[0-9]*' || echo 0); fails=${fails:-0}
          alerted=$(echo "$state" | grep -o '"alerted":true' || true)
          last_pending=$(echo "$state" | grep -o '"pending":[0-9]*' | grep -o '[0-9]*' || echo 0); last_pending=${last_pending:-0}
          down_since=$(echo "$state" | grep -o '"downSince":[0-9]*' | grep -o '[0-9]*' || echo 0); down_since=${down_since:-0}
          last_alert=$(echo "$state" | grep -o '"lastAlert":[0-9]*' | grep -o '[0-9]*' || echo 0); last_alert=${last_alert:-0}
          now=$(date +%s)

          send_sms() {
            curl -s -X POST https://services.leadconnectorhq.com/conversations/messages \
              -H "Authorization: Bearer $GHL_TOKEN" -H "Version: 2021-04-15" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"SMS\",\"contactId\":\"$CONTACT_ID\",\"message\":$(printf '%s' "$1" | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read()))')}" >/dev/null
          }

          if [ "$ok" = "1" ]; then
            if [ -n "$alerted" ]; then
              mins=$(( (now - down_since) / 60 ))
              send_sms "✅ Mac mini is back online (down ~${mins} min). Sibo HQ and fleet are healthy; any overdue scheduled replies are sending now."
            fi
            new_state="{\"fails\":0,\"alerted\":false,\"downSince\":0,\"lastAlert\":0,\"pending\":${pending:-0}}"
            echo "healthy (pending=${pending:-0}, fleet ok)"
          else
            fails=$((fails + 1))
            [ "$down_since" = "0" ] && down_since=$now
            do_alert=""
            if [ -z "$alerted" ] && [ "$fails" -ge 2 ]; then do_alert=1; fi
            if [ -n "$alerted" ] && [ $((now - last_alert)) -gt 21600 ]; then do_alert=1; fi
            if [ -n "$do_alert" ]; then
              mins=$(( (now - down_since) / 60 ))
              if [ "$dark" = "1" ]; then
                # Nothing on the Mac is reachable from the internet -> no auto-fix
                # path exists. This SMS comes from GitHub+GHL cloud, Mac-independent.
                send_sms "🖤 MAC DARK — Sibo HQ and fleet-health are both unreachable from the internet (~${mins} min). Likely power, internet, or tailscale down. No auto-fix possible from outside; check the Mac (power light, router). Message sync, schedules and lead apps are all paused."
              else
                job="sibohq"; what="Sibo HQ health check"
                if [ "$hq_ok" = "1" ]; then job="fleet"; what="fleet health (an always-on app is down/sick)"; fi
                fix_note="auto-fix trigger not configured"
                if [ -n "${FIX_URL:-}" ]; then
                  fix_resp=$(curl -s --max-time 20 -X POST "${FIX_URL}&job=${job}" || true)
                  if echo "$fix_resp" | grep -q '"dispatched":true'; then fix_note="🔧 auto-fix Claude session dispatched on the Mac"
                  elif echo "$fix_resp" | grep -q 'rate-limited'; then fix_note="🔧 auto-fix already dispatched recently (rate-limited)"
                  else fix_note="⚠️ auto-fix trigger failed (${fix_resp:-no response})"; fi
                fi
                extra=""
                if [ "$last_pending" -gt 0 ]; then extra=" ${last_pending} scheduled reply(ies) are waiting and will send late."; fi
                send_sms "🐕⚠️ ${what} failing for ~${mins} min (Mac partially up — other endpoints answer). ${fix_note}.${extra}"
              fi
              new_state="{\"fails\":$fails,\"alerted\":true,\"downSince\":$down_since,\"lastAlert\":$now,\"pending\":$last_pending}"
            else
              a=false; [ -n "$alerted" ] && a=true
              new_state="{\"fails\":$fails,\"alerted\":$a,\"downSince\":$down_since,\"lastAlert\":$last_alert,\"pending\":$last_pending}"
            fi
            echo "unreachable (fails=$fails, hq_ok=$hq_ok fleet_ok=$fleet_ok dark=$dark)"
          fi

          # Persist when changed — plus a monthly keep-alive commit, because
          # GitHub disables cron workflows after 60 days without repo activity.
          w=$(echo "$state" | grep -o '"w":[0-9]*' | grep -o '[0-9]*' || echo 0); w=${w:-0}
          prev_no_w=$(echo "$state" | sed 's/,"w":[0-9]*//')
          if [ "$new_state" != "$prev_no_w" ] || [ $((now - w)) -gt 2592000 ]; then
            new_state="${new_state%\}},\"w\":$now}"
            sha=$(gh api "repos/$REPO/contents/state.json?ref=state" -q .sha 2>/dev/null || echo "")
            b64=$(printf '%s' "$new_state" | base64 -w0)
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/$REPO/contents/state.json" -f message=state -f content="$b64" -f branch=state -f sha="$sha" >/dev/null
            else
              gh api -X PUT "repos/$REPO/contents/state.json" -f message=state -f content="$b64" -f branch=state >/dev/null
            fi
            echo "state saved: $new_state"
          fi
